"flex-grow container mx-auto px-4 py-4\">\n    <!-- [MODULE] stu_答题区域:题目卡片 -->\n    <div class=\"bg-cream rounded-lg shadow-paper border border-secondary/30 p-5 mb-6 transform transition-all duration-300 hover:shadow-lg\" style=\"padding-left:20px\">\n<div class=\"min-h-[200px] p-4 pt-6 pr-2\" style=\"padding-left:16px;width:;height:\">\n      <h2 class=\"text-lg font-kai font-bold text-primary mb-6 leading-relaxed\">\n       迎大旗作为部分地区的传统非遗项目，其核心特色不包括以下哪一项？\n      </h2>\n      <!-- [MODULE] vwx_答题区域:题目选项 -->\n      <div class=\"space-y-4 mt-4\">\n       <!-- [MODULE] yza_答题区域:题目选项:A选项 -->\n       <div class=\"option-card border border-secondary rounded-lg p-3 pl-10 relative cursor-pointer\" data-option=\"A\">\n        <div class=\"absolute left-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full border-2 border-secondary flex items-center justify-center text-secondary font-bold\">\n         A\n        </div>\n        <p class=\"text-dark/90\">\n         通常需要数十人协作完成大旗的升起与挥舞\n        </p>\n       </div>\n       <!-- [/MODULE] yza_答题区域:题目选项:A选项 -- 单选题选项A，点击可选择 -->\n       <!-- [MODULE] bcd_答题区域:题目选项:B选项 -->\n       <div class=\"option-card border border-secondary rounded-lg p-3 pl-10 relative cursor-pointer\" data-option=\"B\">\n        <div class=\"absolute left-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full border-2 border-secondary flex items-center justify-center text-secondary font-bold\">\n         B\n        </div>\n        <p class=\"text-dark/90\">\n         大旗的纹样多融入当地历史故事或吉祥寓意\n        </p>\n       </div>\n       <!-- [/MODULE] bcd_答题区域:题目选项:B选项 -- 单选题选项B，点击可选择 -->\n       <!-- [MODULE] efg_答题区域:题目选项:C选项 -->\n       <div class=\"option-card border border-secondary rounded-lg p-3 pl-10 relative cursor-pointer\" data-option=\"C\">\n        <div class=\"absolute left-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full border-2 border-secondary flex items-center justify-center text-secondary font-bold\">\n         C\n        </div>\n        <p class=\"text-dark/90\">\n         活动常与端午赛龙舟习俗结合开展\n        </p>\n       </div>\n       <!-- [/MODULE] efg_答题区域:题目选项:C选项 -- 单选题选项C，点击可选择 -->\n       <!-- [MODULE] hij_答题区域:题目选项:D选项 -->\n       <div class=\"option-card border border-secondary rounded-lg p-3 pl-10 relative cursor-pointer\" data-option=\"D\">\n        <div class=\"absolute left-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full border-2 border-secondary flex items-center justify-center text-secondary font-bold\">\n         D\n        </div>\n        <p class=\"text-dark/90\">\n         部分地区的大旗杆高度可达十余米，材质以实木为主\n        </p>\n       </div>\n       <!-- [/MODULE] hij_答题区域:题目选项:D选项 -- 单选题选项D，点击可选择 -->\n      </div>\n      <!-- [/MODULE] vwx_答题区域:题目选项 -- 包含四个单选题选项 -->\n     </div>\n     <!-- 手写笔记区域已移除 -->\n    </div>\n    <!-- [/MODULE] stu_答题区域:题目卡片 -- 显示当前题目内容和选项 -->\n    <!-- 工具栏区域已移除 -->\n   </main>\n   <!-- [/MODULE] pqr_主内容区域 -- 包含题目卡片和笔记工具栏 -->\n   <!-- [MODULE] wxy_底部导航栏 -->\n   <footer class=\"bg-cream border-t border-secondary/30 py-3 px-4 sticky bottom-0 z-40\">\n    <div class=\"flex justify-between items-center\">\n     <button class=\"px-4 py-2 border border-secondary text-primary rounded-lg hover:bg-primary/5 transition-colors disabled:opacity-50 disabled:cursor-not-allowed\" disabled=\"\" id=\"prev-btn\">\n      <i class=\"fas fa-arrow-left mr-1\">\n      </i>\n      上一题\n     </button>\n     <button class=\"px-6 py-2 bg-primary text-cream rounded-lg hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed\" disabled=\"\" id=\"next-btn\">\n      下一题\n      <i class=\"fas fa-arrow-right ml-1\">\n      </i>\n     </button>\n    </div>\n   </footer>\n   <!-- [/MODULE] wxy_底部导航栏 -- 提供上一题和下一题导航功能 -->\n   <!-- [MODULE] z12_答题结果模态框 -->\n   <div class=\"fixed inset-0 bg-dark/50 z-50 hidden flex items-center justify-center p-4\" id=\"result-modal\">\n    <div class=\"bg-cream rounded-lg shadow-xl w-full max-w-md border-2 border-secondary transform transition-all duration-300 scale-95 opacity-0\" id=\"modal-content\">\n     <div class=\"p-4 border-b border-secondary flex justify-between items-center\">\n      <h2 class=\"font-kai font-bold text-xl text-primary\">\n       答题结果\n      </h2>\n      <button class=\"p-2 rounded-full hover:bg-secondary/20 transition-colors\" id=\"close-result-modal\">\n       <i class=\"fas fa-times text-primary\">\n       </i>\n      </button>\n     </div>\n     <div class=\"p-6 text-center\">\n      <div class=\"w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4\">\n       <i class=\"fas fa-check text-3xl text-primary\" id=\"result-icon\">\n       </i>\n      </div>\n      <h3 class=\"font-kai font-bold text-lg text-primary mb-2\" id=\"result-title\">\n       回答正确\n      </h3>\n      <p class=\"text-sm text-dark/80 mb-6\" id=\"result-desc\">\n       迎大旗活动通常与当地传统节日结合，而非端午赛龙舟习俗。赛龙舟是水上活动，与迎大旗的陆地表演形式差异较大。\n      </p>\n      <div class=\"flex justify-center space-x-3\">\n       <button class=\"px-4 py-2 border border-secondary text-primary rounded-lg hover:bg-primary/5 transition-colors text-sm\" id=\"view-explain-btn\">\n        查看详细解析\n       </button>\n       <button class=\"px-6 py-2 bg-primary text-cream rounded-lg hover:bg-primary/90 transition-colors text-sm\" id=\"confirm-result-btn\">\n        继续答题\n       </button>\n      </div>\n     </div>\n    </div>\n   </div>\n   <!-- [/MODULE] z12_答题结果模态框 -- 显示答题结果和解析 -->\n  </div>\n  <!-- [/MODULE] abc_页面容器 -- 包含整个答题页面的所有内容 -->\n  <!-- [JSMOD] a3b_手写笔记功能 -->\n  <script id=\"note-script\">\n   // 页面加载时初始化渲染\ndocument.addEventListener('DOMContentLoaded', function () {\n  // 获取DOM元素\n  var noteArea = document.getElementById('note-area');\n  var penBrushes = document.querySelectorAll('.pen-brush');\n  var undoBtn = document.getElementById('undo-btn');\n  var clearBtn = document.getElementById('clear-btn');\n\n  // 绘画状态变量\n  var isDrawing = false;\n  var lastX = 0;\n  var lastY = 0;\n  var currentColor = '#2D3748';\n  var currentSize = 2;\n  var drawingHistory = [];\n  var historyIndex = -1;\n\n  // 创建canvas元素\n  function initCanvas() {\n    var canvas = document.createElement('canvas');\n    canvas.id = 'drawing-canvas';\n    canvas.width = noteArea.offsetWidth;\n    canvas.height = noteArea.offsetHeight;\n    canvas.style.position = 'absolute';\n    canvas.style.top = '0';\n    canvas.style.left = '0';\n    canvas.style.touchAction = 'none'; // 防止触摸滚动\n    noteArea.appendChild(canvas);\n\n    // 调整canvas大小\n    function resizeCanvas() {\n      var tempCanvas = document.createElement('canvas');\n      var tempCtx = tempCanvas.getContext('2d');\n      tempCanvas.width = canvas.width;\n      tempCanvas.height = canvas.height;\n      tempCtx.drawImage(canvas, 0, 0);\n      canvas.width = noteArea.offsetWidth;\n      canvas.height = noteArea.offsetHeight;\n      var ctx = canvas.getContext('2d');\n      ctx.drawImage(tempCanvas, 0, 0);\n    }\n\n    // 监听窗口大小变化\n    window.addEventListener('resize', resizeCanvas);\n    return canvas;\n  }\n\n  // 初始化canvas\n  var canvas = initCanvas();\n  var ctx = canvas.getContext('2d');\n\n  // 设置画笔样式\n  ctx.strokeStyle = currentColor;\n  ctx.lineWidth = currentSize;\n  ctx.lineCap = 'round';\n  ctx.lineJoin = 'round';\n\n  // 保存当前画布状态到历史记录\n  function saveToHistory() {\n    // 如果在历史记录中间添加新操作，删除后面的历史\n    if (historyIndex < drawingHistory.length - 1) {\n      drawingHistory = drawingHistory.slice(0, historyIndex + 1);\n    }\n\n    // 将当前画布状态保存为图像数据URL\n    drawingHistory.push(canvas.toDataURL());\n    historyIndex = drawingHistory.length - 1;\n  }\n\n  // 从历史记录恢复画布状态\n  function restoreFromHistory(index) {\n    if (index < 0 || index >= drawingHistory.length) return;\n    var img = new Image();\n    img.onload = function () {\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\n      ctx.drawImage(img, 0, 0);\n    };\n    img.src = drawingHistory[index];\n    historyIndex = index;\n  }\n\n  // 开始绘画\n  function startDrawing(e) {\n    isDrawing = true;\n\n    // 获取触摸或鼠标位置\n    var rect = canvas.getBoundingClientRect();\n    var clientX, clientY;\n    if (e.type.includes('touch')) {\n      clientX = e.touches[0].clientX - rect.left;\n      clientY = e.touches[0].clientY - rect.top;\n    } else {\n      clientX = e.clientX - rect.left;\n      clientY = e.clientY - rect.top;\n    }\n    // 保存当前状态到历史记录\n    lastX = clientX;\n    lastY = clientY;\n    saveToHistory();\n  }\n\n  // 绘制中\n  function draw(e) {\n    if (!isDrawing) return;\n    e.preventDefault();\n\n    // 获取触摸或鼠标位置\n    var rect = canvas.getBoundingClientRect();\n    var clientX, clientY;\n    if (e.type.includes('touch')) {\n      clientX = e.touches[0].clientX - rect.left;\n      clientY = e.touches[0].clientY - rect.top;\n    } else {\n      clientX = e.clientX - rect.left;\n      clientY = e.clientY - rect.top;\n    }\n\n    // 绘制线条\n    ctx.beginPath();\n    ctx.moveTo(lastX, lastY);\n    ctx.lineTo(clientX, clientY);\n    ctx.stroke();\n    lastX = clientX;\n    lastY = clientY;\n  }\n\n  // 结束绘画\n  function stopDrawing() {\n    isDrawing = false;\n  }\n\n  // 撤销操作\n  function undoDrawing() {\n    if (historyIndex > 0) {\n      restoreFromHistory(historyIndex - 1);\n    } else if (historyIndex === 0) {\n      // 清除画布\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\n      drawingHistory = [];\n      historyIndex = -1;\n    }\n  }\n\n  // 清除画布\n  function clearDrawing() {\n    saveToHistory(); // 保存清除前的状态\n    ctx.clearRect(0, 0, canvas.width, canvas.height);\n  }\n\n  // 选择画笔颜色和大小\n  function selectPenBrush(brush) {\n    // 移除所有active类\n    penBrushes.forEach(function (b) {\n      return b.classList.remove('active');\n    });\n\n    // 为当前选中的画笔添加active类\n    brush.classList.add('active');\n\n    // 更新当前颜色和大小\n    if (brush.dataset.color) {\n      currentColor = brush.dataset.color;\n      ctx.strokeStyle = currentColor;\n    }\n    if (brush.dataset.size) {\n      currentSize = parseInt(brush.dataset.size);\n      ctx.lineWidth = currentSize;\n    }\n  }\n\n  // 添加事件监听器\n  canvas.addEventListener('mousedown', startDrawing);\n  canvas.addEventListener('mousemove', draw);\n  canvas.addEventListener('mouseup', stopDrawing);\n  canvas.addEventListener('mouseout', stopDrawing);\n\n  // 触摸事件\n  canvas.addEventListener('touchstart', startDrawing);\n  canvas.addEventListener('touchmove', draw);\n  canvas.addEventListener('touchend', stopDrawing);\n  canvas.addEventListener('touchcancel', stopDrawing);\n\n  // 阻止触摸事件的默认行为（防止滚动）\n  noteArea.addEventListener('touchstart', function (e) {\n    return e.preventDefault();\n  });\n  noteArea.addEventListener('touchmove', function (e) {\n    return e.preventDefault();\n  });\n\n  // 画笔选择事件\n  penBrushes.forEach(function (brush) {\n    brush.addEventListener('click', function () {\n      return selectPenBrush(brush);\n    });\n  });\n\n  // 撤销按钮事件\n  undoBtn.addEventListener('click', undoDrawing);\n\n  // 清除按钮事件\n  clearBtn.addEventListener('click', clearDrawing);\n});\n  <\/script>\n  <!-- [/JSMOD] a3b_手写笔记功能 -- 实现手写笔记的绘制、撤销、清除和画笔选择功能 -->\n  <!-- [JSMOD] c4d_答题逻辑功能 -->\n  <script id=\"quiz-script\">\n   // 页面加载时初始化渲染\ndocument.addEventListener('DOMContentLoaded', function () {\n  // 获取DOM元素\n  var optionCards = document.querySelectorAll('.option-card');\n  var nextBtn = document.getElementById('next-btn');\n  var prevBtn = document.getElementById('prev-btn');\n  var resultModal = document.getElementById('result-modal');\n  var modalContent = document.getElementById('modal-content');\n  var closeResultModal = document.getElementById('close-result-modal');\n  var confirmResultBtn = document.getElementById('confirm-result-btn');\n  var timerEl = document.getElementById('timer');\n\n  // 答题状态变量\n  var selectedOption = null;\n  var timeLeft = 10 * 60; // 10分钟，单位秒\n  var timerInterval;\n\n  // 初始化计时器\n  function initTimer() {\n    updateTimerDisplay();\n    timerInterval = setInterval(function () {\n      timeLeft--;\n      updateTimerDisplay();\n      if (timeLeft <= 0) {\n        clearInterval(timerInterval);\n        // 时间到，自动提交\n        submitAnswer();\n      }\n    }, 1000);\n  }\n\n  // 更新计时器显示\n  function updateTimerDisplay() {\n    var minutes = Math.floor(timeLeft / 60);\n    var seconds = timeLeft % 60;\n    timerEl.textContent = \"\".concat(minutes.toString().padStart(2, '0'), \":\").concat(seconds.toString().padStart(2, '0'));\n\n    // 时间少于1分钟时变红\n    if (timeLeft < 60) {\n      timerEl.classList.add('bg-red-500');\n      timerEl.classList.remove('bg-accent');\n    }\n  }\n\n  // 选择答案\n  function selectOption(option) {\n    // 移除之前的选择\n    optionCards.forEach(function (card) {\n      card.classList.remove('selected');\n      card.querySelector('div').classList.remove('bg-primary', 'text-cream');\n      card.querySelector('div').classList.add('border-secondary', 'text-secondary');\n    });\n\n    // 设置新选择\n    selectedOption = option.dataset.option;\n    option.classList.add('selected');\n    var optionLetter = option.querySelector('div');\n    optionLetter.classList.remove('border-secondary', 'text-secondary');\n    optionLetter.classList.add('bg-primary', 'text-cream');\n\n    // 启用下一题按钮\n    nextBtn.disabled = false;\n  }\n\n  // 提交答案\n  function submitAnswer() {\n    clearInterval(timerInterval);\n\n    // 检查答案是否正确（正确答案是C）\n    var isCorrect = selectedOption === 'C';\n\n    // 显示结果模态框\n    showResultModal(isCorrect);\n  }\n\n  // 显示结果模态框\n  function showResultModal(isCorrect) {\n    var resultIcon = document.getElementById('result-icon');\n    var resultTitle = document.getElementById('result-title');\n\n    // 设置结果图标和标题\n    if (isCorrect) {\n      resultIcon.className = 'fas fa-check text-3xl text-green-500';\n      resultTitle.textContent = '回答正确';\n      resultTitle.classList.add('text-green-500');\n      resultTitle.classList.remove('text-red-500');\n    } else {\n      resultIcon.className = 'fas fa-times text-3xl text-red-500';\n      resultTitle.textContent = '回答错误';\n      resultTitle.classList.add('text-red-500');\n      resultTitle.classList.remove('text-green-500');\n\n      // 标记正确答案\n      optionCards.forEach(function (card) {\n        if (card.dataset.option === 'C') {\n          card.classList.add('correct');\n          var optionLetter = card.querySelector('div');\n          optionLetter.classList.remove('border-secondary', 'text-secondary');\n          optionLetter.classList.add('bg-green-500', 'text-white');\n        }\n\n        // 标记错误答案\n        if (card.dataset.option === selectedOption) {\n          card.classList.add('incorrect');\n        }\n      });\n    }\n\n    // 显示模态框\n    resultModal.classList.remove('hidden');\n    resultModal.classList.add('flex');\n\n    // 添加动画效果\n    setTimeout(function () {\n      modalContent.classList.remove('scale-95', 'opacity-0');\n      modalContent.classList.add('scale-100', 'opacity-100');\n    }, 10);\n  }\n\n  // 关闭结果模态框\n  function hideResultModal() {\n    modalContent.classList.remove('scale-100', 'opacity-100');\n    modalContent.classList.add('scale-95', 'opacity-0');\n    setTimeout(function () {\n      resultModal.classList.add('hidden');\n      resultModal.classList.remove('flex');\n\n      // 这里可以添加跳转到下一题的逻辑\n      // 实际应用中应该加载新的题目\n      alert('将进入下一题');\n    }, 300);\n  }\n\n  // 添加事件监听器\n  optionCards.forEach(function (option) {\n    option.addEventListener('click', function () {\n      return selectOption(option);\n    });\n  });\n\n  // 下一题按钮事件\n  nextBtn.addEventListener('click', submitAnswer);\n\n  // 关闭结果模态框事件\n  closeResultModal.addEventListener('click', hideResultModal);\n  confirmResultBtn.addEventListener('click', hideResultModal);\n\n  // 点击模态框背景关闭\n  resultModal.addEventListener('click', function (e) {\n    if (e.target === resultModal) {\n      hideResultModal();\n    }\n  });\n\n  // 初始化计时器\n  initTimer();\n});\n  <\/script>\n  <!-- [/JSMOD] c4d_答题逻辑功能 -- 实现答题选择、答案提交、结果判断和计时器功能 -->\n  <!-- [JSMOD] e5f_页面导航功能 -->\n  <script id=\"nav-script\">\n   // 页面加载时初始化渲染\ndocument.addEventListener('DOMContentLoaded', function () {\n  var backButton = document.getElementById('back-button');\n\n  // 返回按钮事件\n  backButton.addEventListener('click', function () {\n    if (confirm('确定要退出当前答题吗？未完成的答题将不被保存。')) {\n      window.history.back();\n    }\n  });\n});\n  <\/script>\n  <!-- [/JSMOD] e5f_页面导航功能 -- 实现返回按钮功能 -->\n </body>\n</html>\n";
