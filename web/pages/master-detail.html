<div class="min-h-screen flex flex-col bg-paper">
    <header class="bg-primary text-cream shadow-md sticky top-0 z-50">
        <div class="container mx-auto max-w-3xl px-4 py-3 flex items-center space-x-2">
            <button class="p-2 rounded-full hover:bg-secondary/30" onclick="goBack()" aria-label="返回"><i class="fas fa-arrow-left"></i></button>
            <h1 class="text-xl font-kai font-bold">人物介绍</h1>
        </div>
    </header>

    <main class="flex-grow container mx-auto max-w-3xl px-4 py-6">
        <section class="bg-gradient-to-br from-primary to-dark text-cream rounded-2xl shadow-lg overflow-hidden mb-6">
            <div class="p-7 flex flex-col sm:flex-row sm:items-center gap-5">
                <div class="w-28 h-28 shrink-0 rounded-full bg-cream border-4 border-secondary shadow overflow-hidden flex items-center justify-center">
                    <img id="profile-photo" class="hidden w-full h-full object-cover" alt="传承人照片">
                    <span id="profile-avatar" class="text-primary font-kai text-4xl"></span>
                </div>
                <div>
                    <p class="text-secondary text-sm mb-1">非遗课程人物资料</p>
                    <h2 id="profile-name" class="text-3xl font-kai font-bold mb-2"></h2>
                    <span id="profile-badge" class="inline-block bg-cream/15 border border-cream/30 px-3 py-1 rounded-full text-sm"></span>
                    <p id="profile-project" class="text-cream/80 mt-3 text-sm"></p>
                    <a id="profile-source" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 mt-3 text-xs text-secondary hover:text-cream"><i class="fas fa-up-right-from-square"></i><span id="profile-source-label">公开资料来源</span></a>
                </div>
            </div>
        </section>

        <section class="bg-cream rounded-xl shadow-md p-6 border border-secondary/30 mb-6">
            <h3 class="font-kai font-bold text-lg text-primary border-b border-secondary pb-2 mb-4">人物简介</h3>
            <p id="profile-intro" class="text-dark/80 leading-8"></p>
        </section>

        <button id="profile-course-button" class="w-full py-3 bg-primary text-cream rounded-lg hover:bg-primary/90 font-medium"><i class="fas fa-book-open mr-2"></i>进入相关课程</button>
    </main>
</div>

<script>
(function () {
    var course = getSelectedCourse();
    var master = course.master;
    document.title = master.name + ' - 人物介绍';
    document.getElementById('profile-avatar').textContent = master.name.slice(0, 1);
    document.getElementById('profile-name').textContent = master.name;
    document.getElementById('profile-badge').textContent = master.badge;
    document.getElementById('profile-project').textContent = master.project;
    document.getElementById('profile-intro').textContent = master.intro;
    document.getElementById('profile-source').href = master.sourceUrl;
    document.getElementById('profile-source-label').textContent = master.sourceLabel;
    if (master.photo) {
        var photo = document.getElementById('profile-photo');
        var avatar = document.getElementById('profile-avatar');
        photo.src = master.photo;
        photo.alt = master.name + '公开资料照片';
        photo.classList.remove('hidden');
        avatar.classList.add('hidden');
        photo.addEventListener('error', function () { photo.classList.add('hidden'); avatar.classList.remove('hidden'); }, { once: true });
    }
    document.getElementById('profile-course-button').addEventListener('click', function () { navigateToCourse(course.id); });
})();
</script>
