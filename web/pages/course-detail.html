<div class="min-h-screen flex flex-col bg-paper">
    <header class="bg-primary text-cream shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <button class="p-2 rounded-full hover:bg-secondary/30" onclick="goBack()" aria-label="返回"><i class="fas fa-arrow-left"></i></button>
                <h1 class="text-xl font-kai font-bold">课程详情</h1>
            </div>
            <button id="share-course" class="p-2 rounded-full hover:bg-secondary/30" aria-label="分享课程"><i class="fas fa-share-alt"></i></button>
        </div>
    </header>

    <main class="flex-grow pb-20">
        <section class="relative">
            <img id="course-cover" alt="课程封面" class="w-full h-64 md:h-80 object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-dark/90 via-dark/20 to-transparent flex items-end">
                <div class="container mx-auto p-6">
                    <div class="flex items-center space-x-2 mb-2">
                        <span id="course-category" class="bg-primary text-cream text-xs px-2 py-1 rounded-full"></span>
                        <span id="course-level" class="bg-accent text-cream text-xs px-2 py-1 rounded-full"></span>
                    </div>
                    <h2 id="course-title" class="text-cream text-2xl font-kai font-bold mb-2"></h2>
                    <div id="course-meta" class="flex flex-wrap gap-x-3 gap-y-1 text-cream/90 text-sm"></div>
                </div>
            </div>
        </section>

        <div class="container mx-auto px-4 py-6 max-w-4xl">
            <section class="bg-cream rounded-xl shadow-md p-5 mb-6 border border-secondary/30">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <div id="master-avatar" class="w-16 h-16 shrink-0 rounded-full bg-primary text-cream border-2 border-secondary flex items-center justify-center font-kai text-2xl"></div>
                        <div>
                            <p class="text-xs text-dark/50 mb-1">课程人物资料</p>
                            <h3 id="master-name" class="font-kai font-bold text-primary text-lg"></h3>
                            <p id="master-badge" class="text-sm text-dark/70"></p>
                            <p id="master-project" class="text-xs text-dark/60 mt-1"></p>
                        </div>
                    </div>
                    <button id="master-detail-button" class="px-4 py-2 border border-primary text-primary rounded-lg hover:bg-primary hover:text-cream transition-colors text-sm">查看人物介绍</button>
                </div>
            </section>

            <section class="bg-cream rounded-xl shadow-md p-5 mb-6 border border-secondary/30">
                <h3 class="text-lg font-kai font-bold text-primary mb-3 border-b border-secondary pb-2">课程介绍</h3>
                <div id="course-intro" class="space-y-3 text-dark/80 leading-relaxed"></div>
            </section>

            <section class="bg-cream rounded-xl shadow-md p-5 mb-6 border border-secondary/30">
                <div class="flex items-end justify-between border-b border-secondary pb-2 mb-3">
                    <h3 class="text-lg font-kai font-bold text-primary">课程大纲</h3>
                    <span class="text-xs text-dark/55">前 2 节开放 · 后续待解锁</span>
                </div>
                <div id="lesson-list" class="space-y-3"></div>
                <div class="mt-4 p-3 bg-secondary/10 rounded-lg text-xs text-dark/65 leading-relaxed"><i class="fas fa-circle-info text-primary mr-1"></i>前两节为站内原创微课，支持进度拖动与中文语音讲解；后续章节保持锁定，等待课程继续更新。</div>
            </section>

            <section class="bg-cream rounded-xl shadow-md p-5 border border-secondary/30">
                <h3 class="text-lg font-kai font-bold text-primary mb-3 border-b border-secondary pb-2">课后测试</h3>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 bg-gradient-to-r from-primary/10 to-accent/10 rounded-lg border border-primary/20">
                    <div>
                        <h4 id="quiz-title" class="font-medium text-primary mb-1"></h4>
                        <p class="text-sm text-dark/70">共 5 道单选题，完成测试可获得 20 文化币</p>
                    </div>
                    <button id="quiz-button" class="px-5 py-2 bg-primary text-cream rounded-lg hover:bg-primary/90 transition-colors text-sm">开始答题</button>
                </div>
            </section>
        </div>
    </main>

    <footer class="bg-cream border-t border-secondary/30 py-3 px-4 fixed bottom-0 left-0 right-0 z-40">
        <div class="container mx-auto max-w-4xl flex items-center justify-between">
            <div><p class="text-xs text-dark/60">课程价格</p><p class="text-primary font-bold text-lg">免费</p></div>
            <button id="start-course" class="px-8 py-3 bg-primary text-cream rounded-lg hover:bg-primary/90 font-medium"><i class="fas fa-play mr-2"></i>立即学习</button>
        </div>
    </footer>
</div>

<script>
(function () {
    var course = getSelectedCourse();
    document.title = course.title + ' - 非遗文化传承平台';
    document.getElementById('course-cover').src = course.image;
    document.getElementById('course-cover').alt = course.title;
    document.getElementById('course-category').textContent = course.category;
    document.getElementById('course-level').textContent = course.level;
    document.getElementById('course-title').textContent = course.title;
    document.getElementById('course-meta').innerHTML = '<span><i class="fas fa-clock mr-1"></i>' + course.lessons.length + '课时</span><span><i class="fas fa-user mr-1"></i>' + course.learners + '人学习</span><span><i class="fas fa-star text-yellow-400 mr-1"></i>' + course.rating + '</span>';
    if (course.master.photo) document.getElementById('master-avatar').innerHTML = '<img src="' + course.master.photo + '" alt="' + course.master.name + '" class="w-full h-full rounded-full object-cover">';
    else document.getElementById('master-avatar').textContent = course.master.name.slice(0, 1);
    document.getElementById('master-name').textContent = course.master.name;
    document.getElementById('master-badge').textContent = course.master.badge;
    document.getElementById('master-project').textContent = course.master.project;
    document.getElementById('course-intro').innerHTML = course.intro.map(function (paragraph) { return '<p>' + paragraph + '</p>'; }).join('');
    document.getElementById('quiz-title').textContent = course.title + '知识测试';

    document.getElementById('lesson-list').innerHTML = course.lessons.map(function (lesson, index) {
        var locked = Boolean(lesson.locked);
        return '<button type="button" ' + (locked ? 'disabled' : '') + ' data-lesson-index="' + index + '" class="w-full flex items-center justify-between p-3 rounded-lg border text-left transition-all ' +
            (locked ? 'bg-dark/5 border-secondary/15 opacity-60 cursor-not-allowed' : 'bg-white border-secondary/30 hover:shadow-md hover:border-primary cursor-pointer') + '">' +
            '<div class="flex items-center space-x-3 min-w-0">' +
                '<span class="w-9 h-9 shrink-0 rounded-full ' + (locked ? 'bg-dark/10 text-dark/50' : 'bg-primary/10 text-primary') + ' flex items-center justify-center font-bold text-sm">' + (index + 1) + '</span>' +
                '<span class="min-w-0"><span class="font-medium ' + (locked ? 'text-dark/60' : 'text-primary') + ' block">' + lesson.title + '</span><span class="text-xs text-dark/55 mt-1 block"><i class="fas fa-clock mr-1"></i>' + lesson.duration + (locked ? ' · 暂未解锁' : ' · 可播放') + '</span></span>' +
            '</div>' +
            '<i class="fas ' + (locked ? 'fa-lock text-dark/30' : 'fa-play-circle text-primary') + ' text-xl ml-3"></i>' +
        '</button>';
    }).join('');

    document.querySelectorAll('[data-lesson-index]:not([disabled])').forEach(function (button) {
        button.addEventListener('click', function () { navigateToLesson(course.id, Number(button.dataset.lessonIndex)); });
    });
    document.getElementById('master-detail-button').addEventListener('click', function () { navigateToMaster(course.id); });
    document.getElementById('quiz-button').addEventListener('click', function () { navigateToQuiz(course.id); });
    document.getElementById('start-course').addEventListener('click', function () { navigateToLesson(course.id, 0); });
    document.getElementById('share-course').addEventListener('click', function () {
        if (navigator.share) navigator.share({ title: course.title, text: course.summary, url: location.href }).catch(function () {});
        else navigator.clipboard && navigator.clipboard.writeText(location.href).then(function () { alert('课程链接已复制'); });
    });
})();
</script>
