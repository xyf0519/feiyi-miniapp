  <script id="loginScript">document.addEventListener('DOMContentLoaded', function () {
  // 密码显示/隐藏切换
  var togglePassword = document.getElementById('togglePassword');
  var passwordInput = document.getElementById('password');
  togglePassword.addEventListener('click', function () {
    var type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);

    // 切换图标
    var icon = togglePassword.querySelector('i');
    icon.classList.toggle('fa-eye');
    icon.classList.toggle('fa-eye-slash');
  });

  // 登录表单提交处理
  var loginForm = document.getElementById('loginForm');
  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();

    // 获取表单数据
    var formData = new FormData(loginForm);
    var username = formData.get('username');
    var password = formData.get('password');

    // 简单的表单验证
    if (!username || !password) {
      alert('请输入用户名和密码');
      return;
    }

    // 模拟登录请求
    simulateLogin(username, password);
  });

  // 模拟登录函数
  function simulateLogin(username, password) {
    // 显示加载状态
    var submitButton = loginForm.querySelector('button[type="submit"]');
    var originalText = submitButton.innerHTML;
    submitButton.disabled = true;
    submitButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';

    // 模拟API请求延迟
    setTimeout(function () {
      // 这里应该是真实的API调用
      // 模拟登录成功
      if (username && password) {
        // 跳转到新手指引页
        window.location.href = '#guide'; // 在实际应用中应该是真实的页面URL
        alert('登录成功！即将进入新手指引');
      } else {
        alert('用户名或密码错误，请重试');
        submitButton.disabled = false;
        submitButton.innerHTML = originalText;
      }
    }, 1500);
  }

  // 添加输入框聚焦效果
  var inputFields = loginForm.querySelectorAll('input');
  inputFields.forEach(function (input) {
    input.addEventListener('focus', function () {
      var parentDiv = input.closest('div.relative');
      parentDiv.classList.add('scale-[1.02]');
      parentDiv.style.transition = 'transform 0.2s ease';
    });
    input.addEventListener('blur', function () {
      var parentDiv = input.closest('div.relative');
      parentDiv.classList.remove('scale-[1.02]');
    });
  });
});</script>
