  <!-- [JSMOD] v9x_视频播放控制逻辑 --> 
  <script id="videoPlayerScript">document.addEventListener('DOMContentLoaded', function () {
        // 获取DOM元素
        var videoPlayer = document.getElementById('videoPlayer');
        var playPauseButton = document.getElementById('playPauseButton');
        var progressBar = document.getElementById('progressBar');
        var progressBuffer = document.getElementById('progressBuffer');
        var progressThumb = document.getElementById('progressThumb');
        var progressContainer = document.getElementById('progressContainer');
        var currentTimeDisplay = document.getElementById('currentTime');
        var totalTimeDisplay = document.getElementById('totalTime');
        var videoControls = document.getElementById('videoControls');
        var backButton = document.getElementById('backButton');
        
        // 控制栏显示/隐藏相关变量
        var controlsTimeout;
        var CONTROLS_HIDE_DELAY = 3000;
        
        // 格式化时间显示
        function formatTime(seconds) {
            var minutes = Math.floor(seconds / 60);
            var remainingSeconds = Math.floor(seconds % 60);
            return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
        }
        
        // 更新进度条
        function updateProgress() {
            if (videoPlayer.duration) {
                var percent = videoPlayer.currentTime / videoPlayer.duration * 100;
                progressBar.style.width = `${percent}%`;
                progressThumb.style.left = `${percent}%`;
                currentTimeDisplay.textContent = formatTime(videoPlayer.currentTime);
            }
            
            // 更新缓冲进度
            if (videoPlayer.buffered.length > 0) {
                var bufferedEnd = videoPlayer.buffered.end(videoPlayer.buffered.length - 1);
                var duration = videoPlayer.duration;
                if (duration > 0) {
                    var bufferedPercent = bufferedEnd / duration * 100;
                    progressBuffer.style.width = `${bufferedPercent}%`;
                }
            }
        }
        
        // 显示控制栏
        function showControls() {
            videoControls.classList.remove('opacity-0');
            videoControls.classList.add('opacity-100');
            
            // 清除之前的超时隐藏
            clearTimeout(controlsTimeout);
            
            // 设置自动隐藏
            controlsTimeout = setTimeout(hideControls, CONTROLS_HIDE_DELAY);
        }
        
        // 隐藏控制栏
        function hideControls() {
            if (!videoPlayer.paused) {
                videoControls.classList.remove('opacity-100');
                videoControls.classList.add('opacity-0');
            }
        }
        
        // 切换播放/暂停状态
        function togglePlayPause() {
            if (videoPlayer.paused || videoPlayer.ended) {
                videoPlayer.play().then(function () {
                    playPauseButton.innerHTML = '<i class="fas fa-pause text-xl"></i>';
                    showControls();
                }).catch(function (error) {
                    console.error('播放失败:', error);
                    alert('视频播放失败，请检查网络连接');
                });
            } else {
                videoPlayer.pause();
                playPauseButton.innerHTML = '<i class="fas fa-play text-xl"></i>';
                showControls();
            }
        }
        
        // 点击进度条跳转
        function seek(e) {
            var rect = progressContainer.getBoundingClientRect();
            var pos = (e.clientX - rect.left) / rect.width;
            videoPlayer.currentTime = pos * videoPlayer.duration;
        }
        
        // 处理返回按钮点击
        function handleBackButton() {
            // 在实际应用中，这里应该是返回上一页的逻辑
            // 这里使用history.back()作为示例
            history.back();
            // 如果history.back()不可用，使用alert提示
            setTimeout(function () {
                alert('返回上一页');
            }, 100);
        }
        
        // 事件监听
        playPauseButton.addEventListener('click', togglePlayPause);
        videoPlayer.addEventListener('click', togglePlayPause);
        videoPlayer.addEventListener('timeupdate', updateProgress);
        videoPlayer.addEventListener('loadedmetadata', function () {
            totalTimeDisplay.textContent = formatTime(videoPlayer.duration);
        });
        videoPlayer.addEventListener('progress', updateProgress);
        progressContainer.addEventListener('click', seek);
        
        // 控制栏显示/隐藏相关事件
        videoPlayer.addEventListener('mousemove', showControls);
        videoControls.addEventListener('mousemove', showControls);
        videoPlayer.addEventListener('play', showControls);
        videoPlayer.addEventListener('pause', showControls);
        
        // 返回按钮事件
        backButton.addEventListener('click', handleBackButton);
        
        // 初始化显示控制栏
        showControls();
        
        // 模拟视频加载完成（实际应用中不需要）
        setTimeout(function () {
            totalTimeDisplay.textContent = "05:24";
            progressBuffer.style.width = "65%";
        }, 1000);
    });</script>
