  <script id="note-script">
   // 页面加载时初始化渲染
document.addEventListener('DOMContentLoaded', function () {
  // 获取DOM元素
  var noteArea = document.getElementById('note-area');
  var penBrushes = document.querySelectorAll('.pen-brush');
  var undoBtn = document.getElementById('undo-btn');
  var clearBtn = document.getElementById('clear-btn');

  // 绘画状态变量
  var isDrawing = false;
  var lastX = 0;
  var lastY = 0;
  var currentColor = '#2D3748';
  var currentSize = 2;
  var drawingHistory = [];
  var historyIndex = -1;

  // 创建canvas元素
  function initCanvas() {
    var canvas = document.createElement('canvas');
    canvas.id = 'drawing-canvas';
    canvas.width = noteArea.offsetWidth;
    canvas.height = noteArea.offsetHeight;
    canvas.style.position = 'absolute';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.touchAction = 'none'; // 防止触摸滚动
    noteArea.appendChild(canvas);

    // 调整canvas大小
    function resizeCanvas() {
      var tempCanvas = document.createElement('canvas');
      var tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      tempCtx.drawImage(canvas, 0, 0);
      canvas.width = noteArea.offsetWidth;
      canvas.height = noteArea.offsetHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(tempCanvas, 0, 0);
    }

    // 监听窗口大小变化
    window.addEventListener('resize', resizeCanvas);
    return canvas;
  }

  // 初始化canvas
  var canvas = initCanvas();
  var ctx = canvas.getContext('2d');

  // 设置画笔样式
  ctx.strokeStyle = currentColor;
  ctx.lineWidth = currentSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 保存当前画布状态到历史记录
  function saveToHistory() {
    // 如果在历史记录中间添加新操作，删除后面的历史
    if (historyIndex < drawingHistory.length - 1) {
      drawingHistory = drawingHistory.slice(0, historyIndex + 1);
    }

    // 将当前画布状态保存为图像数据URL
    drawingHistory.push(canvas.toDataURL());
    historyIndex = drawingHistory.length - 1;
  }

  // 从历史记录恢复画布状态
  function restoreFromHistory(index) {
    if (index < 0 || index >= drawingHistory.length) return;
    var img = new Image();
    img.onload = function () {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = drawingHistory[index];
    historyIndex = index;
  }

  // 开始绘画
  function startDrawing(e) {
    isDrawing = true;

    // 获取触摸或鼠标位置
    var rect = canvas.getBoundingClientRect();
    var clientX, clientY;
    if (e.type.includes('touch')) {
      clientX = e.touches[0].clientX - rect.left;
      clientY = e.touches[0].clientY - rect.top;
    } else {
      clientX = e.clientX - rect.left;
      clientY = e.clientY - rect.top;
    }
    // 保存当前状态到历史记录
    lastX = clientX;
    lastY = clientY;
    saveToHistory();
  }

  // 绘制中
  function draw(e) {
    if (!isDrawing) return;
    e.preventDefault();

    // 获取触摸或鼠标位置
    var rect = canvas.getBoundingClientRect();
    var clientX, clientY;
    if (e.type.includes('touch')) {
      clientX = e.touches[0].clientX - rect.left;
      clientY = e.touches[0].clientY - rect.top;
    } else {
      clientX = e.clientX - rect.left;
      clientY = e.clientY - rect.top;
    }

    // 绘制线条
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(clientX, clientY);
    ctx.stroke();
    lastX = clientX;
    lastY = clientY;
  }

  // 结束绘画
  function stopDrawing() {
    isDrawing = false;
  }

  // 撤销操作
  function undoDrawing() {
    if (historyIndex > 0) {
      restoreFromHistory(historyIndex - 1);
    } else if (historyIndex === 0) {
      // 清除画布
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawingHistory = [];
      historyIndex = -1;
    }
  }

  // 清除画布
  function clearDrawing() {
    saveToHistory(); // 保存清除前的状态
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // 选择画笔颜色和大小
  function selectPenBrush(brush) {
    // 移除所有active类
    penBrushes.forEach(function (b) {
      return b.classList.remove('active');
    });

    // 为当前选中的画笔添加active类
    brush.classList.add('active');

    // 更新当前颜色和大小
    if (brush.dataset.color) {
      currentColor = brush.dataset.color;
      ctx.strokeStyle = currentColor;
    }
    if (brush.dataset.size) {
      currentSize = parseInt(brush.dataset.size);
      ctx.lineWidth = currentSize;
    }
  }

  // 添加事件监听器
  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseout', stopDrawing);

  // 触摸事件
  canvas.addEventListener('touchstart', startDrawing);
  canvas.addEventListener('touchmove', draw);
  canvas.addEventListener('touchend', stopDrawing);
  canvas.addEventListener('touchcancel', stopDrawing);

  // 阻止触摸事件的默认行为（防止滚动）
  noteArea.addEventListener('touchstart', function (e) {
    return e.preventDefault();
  });
  noteArea.addEventListener('touchmove', function (e) {
    return e.preventDefault();
  });

  // 画笔选择事件
  penBrushes.forEach(function (brush) {
    brush.addEventListener('click', function () {
      return selectPenBrush(brush);
    });
  });

  // 撤销按钮事件
  undoBtn.addEventListener('click', undoDrawing);

  // 清除按钮事件
  clearBtn.addEventListener('click', clearDrawing);
});
  </script>

  <script id="quiz-script">
   // 页面加载时初始化渲染
document.addEventListener('DOMContentLoaded', function () {
  // 获取DOM元素
  var optionCards = document.querySelectorAll('.option-card');
  var nextBtn = document.getElementById('next-btn');
  var prevBtn = document.getElementById('prev-btn');
  var resultModal = document.getElementById('result-modal');
  var modalContent = document.getElementById('modal-content');
  var closeResultModal = document.getElementById('close-result-modal');
  var confirmResultBtn = document.getElementById('confirm-result-btn');
  var timerEl = document.getElementById('timer');

  // 答题状态变量
  var selectedOption = null;
  var timeLeft = 10 * 60; // 10分钟，单位秒
  var timerInterval;

  // 初始化计时器
  function initTimer() {
    updateTimerDisplay();
    timerInterval = setInterval(function () {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        // 时间到，自动提交
        submitAnswer();
      }
    }, 1000);
  }

  // 更新计时器显示
  function updateTimerDisplay() {
    var minutes = Math.floor(timeLeft / 60);
    var seconds = timeLeft % 60;
    timerEl.textContent = "".concat(minutes.toString().padStart(2, '0'), ":").concat(seconds.toString().padStart(2, '0'));

    // 时间少于1分钟时变红
    if (timeLeft < 60) {
      timerEl.classList.add('bg-red-500');
      timerEl.classList.remove('bg-accent');
    }
  }

  // 选择答案
  function selectOption(option) {
    // 移除之前的选择
    optionCards.forEach(function (card) {
      card.classList.remove('selected');
      card.querySelector('div').classList.remove('bg-primary', 'text-cream');
      card.querySelector('div').classList.add('border-secondary', 'text-secondary');
    });

    // 设置新选择
    selectedOption = option.dataset.option;
    option.classList.add('selected');
    var optionLetter = option.querySelector('div');
    optionLetter.classList.remove('border-secondary', 'text-secondary');
    optionLetter.classList.add('bg-primary', 'text-cream');

    // 启用下一题按钮
    nextBtn.disabled = false;
  }

  // 提交答案
  function submitAnswer() {
    clearInterval(timerInterval);

    // 检查答案是否正确（正确答案是C）
    var isCorrect = selectedOption === 'C';

    // 显示结果模态框
    showResultModal(isCorrect);
  }

  // 显示结果模态框
  function showResultModal(isCorrect) {
    var resultIcon = document.getElementById('result-icon');
    var resultTitle = document.getElementById('result-title');

    // 设置结果图标和标题
    if (isCorrect) {
      resultIcon.className = 'fas fa-check text-3xl text-green-500';
      resultTitle.textContent = '回答正确';
      resultTitle.classList.add('text-green-500');
      resultTitle.classList.remove('text-red-500');
    } else {
      resultIcon.className = 'fas fa-times text-3xl text-red-500';
      resultTitle.textContent = '回答错误';
      resultTitle.classList.add('text-red-500');
      resultTitle.classList.remove('text-green-500');

      // 标记正确答案
      optionCards.forEach(function (card) {
        if (card.dataset.option === 'C') {
          card.classList.add('correct');
          var optionLetter = card.querySelector('div');
          optionLetter.classList.remove('border-secondary', 'text-secondary');
          optionLetter.classList.add('bg-green-500', 'text-white');
        }

        // 标记错误答案
        if (card.dataset.option === selectedOption) {
          card.classList.add('incorrect');
        }
      });
    }

    // 显示模态框
    resultModal.classList.remove('hidden');
    resultModal.classList.add('flex');

    // 添加动画效果
    setTimeout(function () {
      modalContent.classList.remove('scale-95', 'opacity-0');
      modalContent.classList.add('scale-100', 'opacity-100');
    }, 10);
  }

  // 关闭结果模态框
  function hideResultModal() {
    modalContent.classList.remove('scale-100', 'opacity-100');
    modalContent.classList.add('scale-95', 'opacity-0');
    setTimeout(function () {
      resultModal.classList.add('hidden');
      resultModal.classList.remove('flex');

      // 这里可以添加跳转到下一题的逻辑
      // 实际应用中应该加载新的题目
      alert('将进入下一题');
    }, 300);
  }

  // 添加事件监听器
  optionCards.forEach(function (option) {
    option.addEventListener('click', function () {
      return selectOption(option);
    });
  });

  // 下一题按钮事件
  nextBtn.addEventListener('click', submitAnswer);

  // 关闭结果模态框事件
  closeResultModal.addEventListener('click', hideResultModal);
  confirmResultBtn.addEventListener('click', hideResultModal);

  // 点击模态框背景关闭
  resultModal.addEventListener('click', function (e) {
    if (e.target === resultModal) {
      hideResultModal();
    }
  });

  // 初始化计时器
  initTimer();
});
  </script>
