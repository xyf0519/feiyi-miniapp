nt.getElementById('close-mobile-menu');\n  var mobileMenu = document.getElementById('mobile-menu');\n  var mobileMenuContent = document.getElementById('mobile-menu-content');\n  var mobileLoginButton = document.getElementById('mobile-login-button');\n\n  // 用户菜单交互\n  var userMenuButton = document.getElementById('user-menu-button');\n  var userMenu = document.getElementById('user-menu');\n  var logoutButton = document.getElementById('logout-button');\n\n  // 登录模态框交互\n  var loginModal = document.getElementById('login-modal');\n  var closeLoginModal = document.getElementById('close-login-modal');\n  var togglePassword = document.getElementById('toggle-password');\n  var loginPassword = document.getElementById('login-password');\n  var doLoginButton = document.getElementById('do-login');\n\n  // 点击移动菜单按钮打开菜单\n  mobileMenuButton.addEventListener('click', function () {\n    mobileMenu.classList.remove('hidden');\n    setTimeout(function () {\n      mobileMenuContent.classList.remove('translate-x-[-100%]');\n      mobileMenuContent.classList.add('translate-x-0');\n    }, 10);\n  });\n\n  // 关闭移动菜单\n  function closeMobileMenu() {\n    mobileMenuContent.classList.remove('translate-x-0');\n    mobileMenuContent.classList.add('translate-x-[-100%]');\n    setTimeout(function () {\n      mobileMenu.classList.add('hidden');\n    }, 300);\n  }\n  closeMobileMenuButton.addEventListener('click', closeMobileMenu);\n  mobileMenu.addEventListener('click', function (e) {\n    if (e.target === mobileMenu) {\n      closeMobileMenu();\n    }\n  });\n\n  // 点击用户菜单按钮切换菜单显示\n  userMenuButton.addEventListener('click', function (e) {\n    e.stopPropagation();\n    userMenu.classList.toggle('hidden');\n  });\n\n  // 点击页面其他地方关闭用户菜单\n  document.addEventListener('click', function () {\n    userMenu.classList.add('hidden');\n  });\n\n  // 阻止用户菜单内部点击事件冒泡\n  userMenu.addEventListener('click', function (e) {\n    e.stopPropagation();\n  });\n\n  // 打开登录模态框\n  function openLoginModal() {\n    loginModal.classList.remove('hidden');\n    loginModal.classList.add('flex');\n    document.body.style.overflow = 'hidden';\n  }\n\n  // 关闭登录模态框\n  function closeLoginModalFunc() {\n    loginModal.classList.add('hidden');\n    loginModal.classList.remove('flex');\n    document.body.style.overflow = '';\n  }\n\n  // 移动端登录按钮\n  mobileLoginButton.addEventListener('click', function () {\n    closeMobileMenu();\n    openLoginModal();\n  });\n\n  // 退出登录按钮\n  logoutButton.addEventListener('click', function () {\n    userMenu.classList.add('hidden');\n    openLoginModal();\n  });\n\n  // 关闭登录模态框\n  closeLoginModal.addEventListener('click', closeLoginModalFunc);\n  loginModal.addEventListener('click', function (e) {\n    if (e.target === loginModal) {\n      closeLoginModalFunc();\n    }\n  });\n\n  // 切换密码显示/隐藏\n  togglePassword.addEventListener('click', function () {\n    var type = loginPassword.getAttribute('type') === 'password' ? 'text' : 'password';\n    loginPassword.setAttribute('type', type);\n    togglePassword.innerHTML = type === 'password' ? '<i class=\"fas fa-eye-slash\"></i>' : '<i class=\"fas fa-eye\"></i>';\n  });\n\n  // 登录按钮点击事件\n  doLoginButton.addEventListener('click', function () {\n    var phone = document.getElementById('login-phone').value;\n    var password = loginPassword.value;\n\n    // 简单验证\n    if (!phone) {\n      alert('请输入手机号');\n      return;\n    }\n    if (!password) {\n      alert('请输入密码');\n      return;\n    }\n\n    // 这里应该有实际的登录验证逻辑\n    alert('登录成功！');\n    closeLoginModalFunc();\n\n    // 模拟登录状态更新\n    document.querySelector('#user-menu .font-medium').textContent = '非遗爱好者';\n    document.querySelector('#user-menu .text-sm').textContent = '已登录';\n    document.querySelector('#mobile-menu .font-medium').textContent = '非遗爱好者';\n    document.querySelector('#mobile-menu .text-sm').textContent = '已登录';\n  });\n\n  // 点击移动菜单中的链接关闭菜单\n  var mobileMenuLinks = mobileMenu.querySelectorAll('a');\n  mobileMenuLinks.forEach(function (link) {\n    link.addEventListener('click', closeMobileMenu);\n  });\n});<\/script>\n<!-- [/JSMOD] t8u_页面导航交互 -- 处理移动端菜单、用户菜单和登录模态框的交互逻辑 -->\n<!-- [JSMOD] v9w_轮播图交互 -->\n<script id='carousel-script'>// 页面加载时初始化渲染\ndocument.addEventListener('DOMContentLoaded', function () {\n  var carousel = document.getElementById('carousel');\n  var items = carousel.querySelectorAll('.carousel-item');\n  var dots = carousel.querySelectorAll('.carousel-dot');\n  var prevButton = carousel.querySelector('.carousel-prev');\n  var nextButton = carousel.querySelector('.carousel-next');\n  var currentIndex = 0;\n  var interval;\n\n  // 初始化轮播\n  function initCarousel() {\n    showSlide(currentIndex);\n    startInterval();\n\n    // 鼠标悬停时暂停轮播\n    carousel.addEventListener('mouseenter', stopInterval);\n    carousel.addEventListener('mouseleave', startInterval);\n\n    // 点击指示器切换幻灯片\n    dots.forEach(function (dot, index) {\n      dot.addEventListener('click', function () {\n        goToSlide(index);\n      });\n    });\n\n    // 点击前后按钮切换幻灯片\n    prevButton.addEventListener('click', prevSlide);\n    nextButton.addEventListener('click', nextSlide);\n  }\n\n  // 显示指定索引的幻灯片\n  function showSlide(index) {\n    // 隐藏所有幻灯片\n    items.forEach(function (item) {\n      item.classList.remove('opacity-100');\n      item.classList.add('opacity-0');\n    });\n\n    // 重置所有指示器\n    dots.forEach(function (dot) {\n      dot.classList.remove('opacity-100');\n      dot.classList.add('opacity-50');\n    });\n\n    // 显示当前幻灯片和激活当前指示器\n    items[index].classList.remove('opacity-0');\n    items[index].classList.add('opacity-100');\n    dots[index].classList.remove('opacity-50');\n    dots[index].classList.add('opacity-100');\n    currentIndex = index;\n  }\n\n  // 切换到指定索引的幻灯片\n  function goToSlide(index) {\n    if (index < 0) {\n      index = items.length - 1;\n    } else if (index >= items.length) {\n      index = 0;\n    }\n    showSlide(index);\n    resetInterval();\n  }\n\n  // 切换到上一张幻灯片\n  function prevSlide() {\n    goToSlide(currentIndex - 1);\n  }\n\n  // 切换到下一张幻灯片\n  function nextSlide() {\n    goToSlide(currentIndex + 1);\n  }\n\n  // 开始自动轮播\n  function startInterval() {\n    interval = setInterval(function () {\n      nextSlide();\n    }, 5000);\n  }\n\n  // 停止自动轮播\n  function stopInterval() {\n    clearInterval(interval);\n  }\n\n  // 重置自动轮播计时器\n  function resetInterval() {\n    stopInterval();\n    startInterval();\n  }\n\n  // 初始化轮播\n  initCarousel();\n});<\/script>\n<!-- [/JSMOD] v9w_轮播图交互 -- 实现轮播图的自动播放和手动切换功能 -->\n<!-- [JSMOD] x0y_学习数据图表 -->\n<script id='chart-script'>// 页面加载时初始化渲染\ndocument.addEventListener('DOMContentLoaded', function () {\n  // 初始化学习数据图表\n  function initLearningChart() {\n    var chartDom = document.getElementById('learning-chart');\n    if (!chartDom) return;\n\n    // 检查DOM是否可见\n    var observer = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          // 元素可见时初始化图表\n          var myChart = echarts.init(chartDom);\n\n          // 图表配置\n          var option = {\n            title: {\n              text: '学习时长趋势',\n              left: 'center',\n              textStyle: {\n                color: '#8B4513',\n                fontFamily: '\"Noto Serif SC\", serif'\n              }\n            },\n            tooltip: {\n              trigger: 'axis',\n              axisPointer: {\n                type: 'shadow'\n              }\n            },\n            legend: {\n              data: ['学习时长(小时)'],\n              bottom: 0\n            },\n            grid: {\n              left: '3%',\n              right: '4%',\n              bottom: '15%',\n              top: '15%',\n              containLabel: true\n            },\n            xAxis: {\n              type: 'category',\n              data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],\n              axisLine: {\n                lineStyle: {\n                  color: '#D2B48C'\n                }\n              },\n              axisLabel: {\n                color: '#5D4037'\n              }\n            },\n            yAxis: {\n              type: 'value',\n              name: '小时',\n              nameTextStyle: {\n                color: '#5D4037'\n              },\n              axisLine: {\n                lineStyle: {\n                  color: '#D2B48C'\n                }\n              },\n              axisLabel: {\n                color: '#5D4037'\n              },\n              splitLine: {\n                lineStyle: {\n                  color: '#F5DEB3'\n                }\n              }\n            },\n            series: [{\n              name: '学习时长(小时)',\n              type: 'bar',\n              data: [0, 0, 0, 0, 0, 0, 0],\n              itemStyle: {\n                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{\n                  offset: 0,\n                  color: '#CD853F'\n                }, {\n                  offset: 1,\n                  color: '#8B4513'\n                }])\n              },\n              emphasis: {\n                itemStyle: {\n                  color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{\n                    offset: 0,\n                    color: '#8B4513'\n                  }, {\n                    offset: 1,\n                    color: '#CD853F'\n                  }])\n                }\n              }\n            }]\n          };\n\n          // 设置图表配置\n          myChart.setOption(option);\n\n          // 监听窗口大小变化，调整图表大小\n          var resizeObserver = new ResizeObserver(function () {\n            setTimeout(function () {\n              myChart.resize();\n            }, 100);\n          });\n          resizeObserver.observe(chartDom.parentElement);\n\n          // 停止观察\n          observer.unobserve(chartDom);\n        }\n      });\n    });\n\n    // 观察图表容器\n    observer.observe(chartDom);\n  }\n\n  // 初始化学习数据图表\n  initLearningChart();\n});<\/script>\n<!-- [/JSMOD] x0y_学习数据图表 -- 使用echarts绘制学习时长趋势图表，支持响应式调整 -->\n
